<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS Deadlines Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="wrap hero">
    <div>
      <h1>CS Deadlines Hub</h1>
      <p class="sub">Compact venue-first list for scanning deadlines quickly.</p>
    </div>
    <div class="summary-box">
      <div class="summary-label">Visible venues</div>
      <div class="summary-value" id="resultCount">0</div>
    </div>
  </header>

  <section class="wrap controls">
    <input id="search" type="search" placeholder="Search by venue name, acronym, alias, or area" />

    <div class="quick-areas" id="quickAreas">
      <button class="area-btn active" data-area="">All areas</button>
      <button class="area-btn" data-area="AI+Data">AI+Data</button>
      <button class="area-btn" data-area="Systems">Systems</button>
      <button class="area-btn" data-area="Security">Security</button>
      <button class="area-btn" data-area="SE+Theory">SE+Theory</button>
    </div>

    <div class="control-row">
      <select id="typeFilter">
        <option value="">All types</option>
        <option value="conference">Conference</option>
        <option value="workshop">Workshop</option>
      </select>

      <select id="tierFilter">
        <option value="">All tiers</option>
        <option value="top">Top</option>
        <option value="strong">Strong</option>
        <option value="mid">Mid</option>
        <option value="workshop">Workshop tier</option>
        <option value="fast">Fast</option>
      </select>

      <select id="scanFilter">
        <option value="">All scan states</option>
        <option value="enabled">Scan enabled</option>
        <option value="catalog">Catalog only</option>
      </select>

      <label class="toggle">
        <input id="topOnly" type="checkbox" />
        <span>Top tier only</span>
      </label>
    </div>
  </section>

  <main id="list" class="wrap list"></main>

  <template id="rowTemplate">
    <article class="venue-row">
      <div class="row-main">
        <div class="row-left">
          <div class="meta-line">
            <span class="badge tier"></span>
            <span class="badge type"></span>
            <span class="badge scan-state"></span>
            <span class="meta-text">
              <span class="areas"></span>
              <span class="dot">·</span>
              <span class="year"></span>
              <span class="location-wrap"><span class="dot">·</span><span class="location"></span></span>
            </span>
          </div>

          <h2 class="title"></h2>

          <div class="links-line">
            <a class="venue-link" target="_blank" rel="noopener">Venue</a>
            <span class="dot">·</span>
            <a class="cfp-link" target="_blank" rel="noopener">CFP</a>
          </div>
        </div>

        <div class="row-right">
          <div class="status-line">
            <span class="status-chip"></span>
          </div>
          <div class="deadline-primary"></div>
          <div class="deadline-secondary"></div>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
