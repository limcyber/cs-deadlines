<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Computer Science Conferences Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hero doubles as the project intro and a lightweight global control area. -->
  <header class="wrap hero">
    <div>
      <h1>Computer Science Conferences Tracker</h1>
      <p class="sub">A clean, venue-first view of CS conference deadlines, timelines, and CFP links.</p>
    </div>
    <div class="hero-right">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle black and white theme" aria-pressed="false" title="Switch to white theme">
        <span class="theme-track" aria-hidden="true">
          <span class="theme-knob"></span>
        </span>
        <span class="theme-label">BLACK</span>
      </button>
      <div class="summary-box">
        <div class="summary-label">Visible venues</div>
        <div class="summary-value" id="resultCount">0</div>
      </div>
    </div>
  </header>

  <section class="wrap controls">
    <!-- Filters are intentionally compact so the page stays scan-first for deadline browsing. -->
    <input id="search" type="search" placeholder="Search by venue name, acronym, alias, or area" />

    <div class="quick-areas" id="quickAreas">
      <button class="area-btn active" data-area="">All areas</button>
      <button class="area-btn" data-area="AI+Data">AI+Data</button>
      <button class="area-btn" data-area="Systems">Systems</button>
      <button class="area-btn" data-area="Security">Security</button>
      <button class="area-btn" data-area="SE+Theory">SE+Theory</button>
    </div>

    <div class="control-row">
      <select id="typeFilter">
        <option value="">All types</option>
        <option value="conference">Conference</option>
        <option value="workshop">Workshop</option>
      </select>

      <select id="tierFilter">
        <option value="">All tiers</option>
        <option value="top">Top</option>
        <option value="strong">Strong</option>
        <option value="mid">Mid</option>
        <option value="workshop">Workshop tier</option>
        <option value="fast">Fast</option>
      </select>

      <select id="scanFilter">
        <option value="">All scan states</option>
        <option value="enabled">Scan enabled</option>
        <option value="catalog">Catalog only</option>
      </select>

      <select id="sortFilter">
        <option value="nearest">Soonest deadline</option>
        <option value="latest">Latest deadline</option>
        <option value="az">A to Z</option>
        <option value="tier">Tier</option>
      </select>
    </div>
  </section>

  <section class="wrap disclaimer-wrap">
    <p class="disclaimer">Disclaimer: Deadlines are collected automatically and may be inaccurate. Please use the Venue/CFP links to confirm details on the official conference page.</p>
  </section>

  <main id="list" class="wrap list"></main>

  <template id="rowTemplate">
    <!-- Cards are rendered client-side from generated JSON assets. -->
    <article class="venue-row">
      <div class="row-main">
        <div class="row-left">
          <div class="meta-line">
            <span class="badge tier"></span>
            <span class="badge type"></span>
            <span class="badge scan-state"></span>
            <span class="meta-text">
              <span class="areas"></span>
              <span class="dot">·</span>
              <span class="year"></span>
              <span class="location-wrap"><span class="dot">·</span><span class="location"></span></span>
            </span>
          </div>

          <h2 class="title"></h2>

          <div class="links-line">
            <a class="venue-link" target="_blank" rel="noopener">Venue</a>
            <span class="dot">·</span>
            <a class="cfp-link" target="_blank" rel="noopener">CFP</a>
          </div>
        </div>

        <div class="row-right">
          <div class="status-line">
            <span class="status-chip"></span>
          </div>
          <div class="deadline-primary"></div>
          <div class="deadline-secondary"></div>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
